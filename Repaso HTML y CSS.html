<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RepasoHTMLyCSS</title>
<style>
:root{--bg:#0a0a0a;--card:#141414;--line:#2a2a2a;--fg:#f4f4f4;--mut:#8d8d8d;--red:#e11d2e;--green:#22c55e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
code,pre{font-family:ui-monospace,Menlo,Consolas,monospace}
header{padding:56px 20px 24px;max-width:900px;margin:auto}
h1{font-size:clamp(2rem,6vw,3.4rem);margin:0;letter-spacing:-.03em;line-height:1.05}
h1 span{color:var(--red)}
.sub{color:var(--mut);margin:12px 0 20px}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--red);transition:width .4s,background .4s}
.bar i.ok{background:var(--green)}
.pt{font-size:.85rem;color:var(--mut);margin-top:6px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(10,10,10,.92);backdrop-filter:blur(8px);border-block:1px solid var(--line)}
nav div{display:flex;gap:8px;overflow-x:auto;padding:10px 20px;max-width:900px;margin:auto}
nav a{white-space:nowrap;color:var(--mut);text-decoration:none;font-size:.85rem;padding:6px 12px;border:1px solid var(--line);border-radius:99px;transition:.2s}
nav a:hover,nav a.on{color:#fff;border-color:var(--red);background:var(--red)}
main{max-width:900px;margin:auto;padding:0 20px 80px}
.search{width:100%;margin:24px 0 0;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--fg);font:inherit;outline:0}
.search:focus{border-color:var(--red)}
section{margin-top:48px;scroll-margin-top:70px}
h2{font-size:1.5rem;margin:0 0 16px;display:flex;gap:12px;align-items:baseline}
h2 small{color:var(--red);font:600 .8rem ui-monospace,monospace}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;transition:border-color .2s}
details:hover{border-color:#555}
details[open]{border-color:var(--red)}
summary{cursor:pointer;padding:14px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--red);font-size:1.3rem;line-height:1;transition:transform .2s}
details[open] summary::after{transform:rotate(45deg)}
details.done summary{color:var(--green)}
.body{padding:0 16px 16px;color:#d0d0d0}
.body p{margin:0 0 10px}
pre{background:#000;border:1px solid var(--line);border-left:3px solid var(--red);padding:12px;border-radius:6px;overflow-x:auto;font-size:.85rem;margin:0 0 12px;color:#f2c9cc}
.chk{background:none;border:1px solid var(--line);color:var(--mut);padding:6px 12px;border-radius:6px;cursor:pointer;font:inherit;font-size:.85rem}
.chk:hover{border-color:var(--green);color:var(--green)}
.done .chk{background:var(--green);border-color:var(--green);color:#000}
.demo{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:16px}
.demo h3{margin:0 0 12px;font-size:1rem;color:var(--red)}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
select{background:#000;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
select:focus{border-color:var(--red);outline:0}
label{font-size:.8rem;color:var(--mut);display:flex;flex-direction:column;gap:4px}
#fx{display:flex;min-height:150px;border:1px dashed var(--mut);border-radius:6px;padding:8px}
#fx b{background:var(--red);color:#fff;min-width:44px;min-height:44px;padding:10px 14px;border-radius:6px;display:grid;place-items:center;transition:background .2s}
#fx b:nth-child(2){background:#fff;color:#000;height:70px}
#fx b:hover{background:var(--green);color:#000}
.qc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px}
.qm{display:flex;justify-content:space-between;color:var(--mut);font-size:.85rem;margin-bottom:12px}
.q{font-size:1.15rem;font-weight:600;margin:0 0 16px}
.opt{display:block;width:100%;text-align:left;background:#000;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:8px;font:inherit;cursor:pointer;transition:.2s}
.opt:hover:not(:disabled){border-color:#fff;transform:translateX(4px)}
.opt:disabled{cursor:default}
.opt.ok{background:rgba(34,197,94,.15);border-color:var(--green);color:#b6f5cb}
.opt.no{background:rgba(225,29,46,.13);border-color:var(--red);color:#ffb3ba}
.opt.pick{font-weight:700}
.exp{margin-top:12px;padding:12px;border-left:3px solid var(--green);background:#0d0d0d;font-size:.92rem;display:none}
.exp.show{display:block}
.btn{background:var(--red);color:#fff;border:0;border-radius:8px;padding:10px 20px;font:inherit;font-weight:600;cursor:pointer;margin-top:12px;transition:.2s}
.btn:hover{background:#fff;color:#000}
.res{text-align:center;padding:20px 0}
.res big{display:block;font-size:3.5rem;font-weight:800}
.hid{display:none!important}
.ctrl2{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}.lab{display:none;position:relative}.lab.on{display:block}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tab{background:none;border:1px solid var(--line);color:var(--mut);padding:6px 12px;border-radius:99px;font:inherit;font-size:.85rem;cursor:pointer;transition:.2s}.tab:hover{border-color:var(--red);color:#fff}.tab.on{background:var(--red);border-color:var(--red);color:#fff}
.stage{border:1px dashed var(--mut);border-radius:6px;padding:12px;min-height:110px;overflow:auto;margin-bottom:12px}.note{color:var(--mut);font-size:.85rem;margin:10px 0 0}
input[type=range]{accent-color:var(--red);width:170px}.stage input{accent-color:var(--red);background:#000;color:#fff;border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit}
.stage h2{font-size:1rem;margin:0}.stage section,.stage main,.stage figure{border:1px solid #444;padding:6px;margin:4px;border-radius:4px}.stage strong,.stage span{display:block}.hl{outline:2px solid var(--red);background:rgba(225,29,46,.3)}
.frame{background:#000;border:1px solid var(--mut);border-radius:8px;padding:10px;max-width:100%;transition:width .15s}.bar2{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}.menu{gap:6px}.menu a{padding:6px 10px;background:#141414;border:1px solid var(--line);border-radius:6px;font-size:.85rem}
footer{text-align:center;color:var(--mut);font-size:.8rem;padding:30px}
</style>
</head>
<body>
<header>
<h1>Repaso <span>HTML</span> &amp; <span>CSS</span></h1>
<p class="sub">Temario del examen, en tarjetas desplegables. Marca lo que ya domines y ponte a prueba con el test.</p>
<div class="bar"><i id="pb"></i></div>

<nav><div id="nav"></div></nav>
<main>
<input class="search" id="s" type="search" placeholder="Buscar un concepto (flex, label, rem…)">
<div id="topics"></div>
<section id="demo">
<h2><small>LAB</small>Laboratorios</h2>

<div class="demo lab on" data-n="Flexbox"><h3>Flexbox</h3>
<div class="ctrl">
<label>flex-direction<select data-p="flexDirection"><option>row</option><option>column</option><option>row-reverse</option><option>column-reverse</option></select></label>
<label>justify-content<select data-p="justifyContent"><option>flex-start</option><option>center</option><option>flex-end</option><option>space-between</option><option>space-around</option></select></label>

<label>flex-wrap<select data-p="flexWrap"><option>nowrap</option><option>wrap</option></select></label>
<label>gap<select data-p="gap"><option>0px</option><option>10px</option><option>24px</option></select></label>
</div>
<div id="fx"><b>1</b><b>2</b><b>3</b></div>

</div>

<div class="qc" id="qc"></div>
</section>
</main>
<footer>Mucha suerte en el examen.</footer>
<script>
const T=[
["HTML: estructura","est",[
["Estructura del documento","<!DOCTYPE html> indica que es HTML5. <html lang=\"es\"> es la raíz e indica el idioma. <head> contiene metadatos (no se ve). <body> contiene el contenido visible.","<!DOCTYPE html>\n<html lang=\"es\">\n<head>…<\/head>\n<body>…<\/body>\n<\/html>"],
["Metadatos y title","meta charset define la codificación (UTF-8, para tildes y ñ). meta viewport adapta la página a móviles. meta description resume la página para buscadores. title sale en la pestaña, favoritos y resultados de búsqueda: es clave para SEO y accesibilidad.","<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<meta name=\"description\" content=\"Resumen\">\n<title>Mi página<\/title>"],
["Comentarios","No se muestran en el navegador.","<!-- esto es un comentario -->"]]],
["HTML: texto","txt",[
["Títulos h1–h6","Jerarquía: un solo h1 por página y no saltarse niveles (h1, h2, h3…). Se eligen por significado, no por tamaño."],
["Párrafos y énfasis","p = párrafo. Semántico (tiene significado): strong (importancia), em (énfasis). Tipográfico (solo aspecto): b (negrita), i (cursiva).","<strong>Importante<\/strong> <em>énfasis<\/em> <b>negrita<\/b> <i>cursiva<\/i>"],
["Atributo lang en fragmentos","Se usa en un trozo de otro idioma para lectores de pantalla y traductores.","<span lang=\"en\">Hello world<\/span>"],
["Citas: blockquote y q","blockquote = cita larga (bloque, con cite opcional). q = cita corta en línea; el navegador añade las comillas.","<blockquote cite=\"url\">Cita larga<\/blockquote>\n<q>cita corta<\/q>"],
["code, del, ins, data, address, small","code = código en línea. del = texto eliminado (tachado). ins = texto insertado (subrayado). data value = dato legible por máquina. address = información de contacto. small = texto secundario (letra pequeña).","<code>let x<\/code> <del>10€<\/del> <ins>8€<\/ins>\n<data value=\"42\">Cuarenta y dos<\/data>\n<address>info@web.com<\/address>\n<small>© 2025<\/small>"],
["Enlaces <a>","Absolutos (URL completa), relativos (ruta de archivo) y a anclas (#id de la misma página). mailto: abre el correo y tel: llama. target=\"_blank\" abre en pestaña nueva y se acompaña de rel=\"noopener noreferrer\" por seguridad. title da un texto emergente.","<a href=\"https://web.com\">Absoluto<\/a>\n<a href=\"pagina.html\">Relativo<\/a>\n<a href=\"#contacto\">Ancla<\/a>\n<a href=\"mailto:a@b.com\">Correo<\/a>\n<a href=\"tel:+34600000000\">Llamar<\/a>\n<a href=\"https://web.com\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Ir\">Web<\/a>"]]],
["HTML: listas","lis",[
["ul y ol","ul = desordenada (viñetas). ol = ordenada; admite start (número inicial) y type (1, a, A, i, I).","<ul><li>A<\/li><\/ul>\n<ol start=\"5\" type=\"a\"><li>E<\/li><\/ol>"],
["Listas de descripción","dl contiene pares: dt (término) y dd (descripción).","<dl><dt>HTML<\/dt><dd>Lenguaje de marcas<\/dd><\/dl>"],
["Listas anidadas","Una lista dentro de un li, útil dentro de secciones.","<ul><li>Fruta<ul><li>Manzana<\/li><\/ul><\/li><\/ul>"]]],
["HTML semántico y multimedia","sem",[
["Elementos de estructura","header (cabecera), nav (menú), main (contenido principal, uno por página), section (sección temática), article (contenido independiente), footer (pie). div y span no tienen significado: se usan solo cuando no hay etiqueta semántica adecuada (div = bloque, span = en línea)."],
["Imágenes","img lleva src, alt (texto alternativo), width y height. Rutas relativas a carpetas (img/foto.jpg) o imágenes externas (URL completa). figure agrupa la imagen y figcaption es su pie.","<figure>\n <img src=\"img/pikachu.png\" alt=\"Pikachu\" width=\"200\" height=\"200\">\n <figcaption>Pikachu<\/figcaption>\n<\/figure>"],
["Sitio de varias páginas","Se enlazan las páginas con un menú de navegación dentro de nav.","<nav><a href=\"index.html\">Inicio<\/a> <a href=\"fuego.html\">Fuego<\/a><\/nav>"]]],
["Formularios HTML","frm",[
["form, name/value y botones","form usa action (destino) y method=\"get\" (los datos viajan en la URL). Se envían pares name=value, por eso cada campo necesita name. Botones: button o input type=\"submit\".","<form action=\"buscar.php\" method=\"get\">\n <input name=\"q\">\n <button>Enviar<\/button>\n<\/form>\n→ buscar.php?q=texto"],
["label","Se asocia al campo envolviéndolo o con for/id (el for coincide con el id).","<label for=\"n\">Nombre<\/label>\n<input id=\"n\" name=\"n\">"],
["Tipos de input","text, password, email, number, tel, url, search. Además: date, time, color, range, file. Y checkbox (varias opciones) y radio (una sola; mismo name en el grupo).","<input type=\"email\">\n<input type=\"radio\" name=\"g\" value=\"a\" checked>"],
["Atributos de los campos","placeholder (pista), min/max/step (límites y salto en number, range, date), checked (marcado), multiple (varios en file o select), list (enlaza con un datalist).","<input type=\"number\" min=\"1\" max=\"10\" step=\"2\">"],
["select, textarea y datalist","select/option: lista desplegable, simple o con multiple. textarea con rows y cols. datalist da sugerencias a un input mediante list.","<select><option>A<\/option><\/select>\n<textarea rows=\"4\" cols=\"30\"><\/textarea>\n<input list=\"l\"><datalist id=\"l\"><option value=\"Sevilla\"><\/datalist>"],
["Validación nativa","El navegador valida según el tipo (email exige @, url exige URL, number solo números) y con required, min, max.","<input type=\"email\" required>"]]],
["CSS: incorporación","css",[
["Tres formas","En línea (style=\"\" en la etiqueta), interna (<style> en el head) y externa (<link rel=\"stylesheet\"> a un .css). Prioridad: en línea > interna/externa; entre estas dos manda la que se declara después (cascada). La externa es la recomendada.","<link rel=\"stylesheet\" href=\"css/reset.css\">\n<link rel=\"stylesheet\" href=\"css/estilos.css\">"],
["Organización y reset","Carpetas css/, img/ y js/. reset.css (borra estilos por defecto) se carga antes que la hoja propia para que la propia pueda sobrescribirlo."],
["Comentarios CSS","Se escriben con /* */.","/* comentario */"]]],
["CSS: selectores","sel",[
["Básicos y agrupación","Elemento: p. Clase: .fire (varios elementos). Id: #pikachu (único). Agrupación con comas.","p{}  .fire{}  #pikachu{}\nh1, h2, h3{color:red}"],
["Descendiente e hijo directo","El espacio selecciona descendientes a cualquier nivel. > solo hijos directos.","#contenedor strong{}\nsection#fire figure img{}\nmain > section{}"],
["Pseudoclase :hover","Se aplica cuando el ratón pasa por encima. Los atributos id y class son la base para enlazar estilos.","a:hover{color:red}"]]],
["CSS: modelo de caja","box",[
["margin, padding y border","margin = espacio exterior. padding = espacio interior. border = borde (border-width, estilos solid y dashed). border-radius redondea esquinas.","border:2px solid red;\nborder-radius:8px;"],
["width, max-width y centrado","max-width limita el ancho máximo. Centrar un bloque: margin: auto con ancho definido.","main{max-width:900px;margin:0 auto}"],
["box-sizing: border-box","El ancho incluye padding y borde (si no, se suman al width y la caja crece).","*{box-sizing:border-box}"]]],
["CSS: colores y unidades","col",[
["Colores","Por nombre (red), rgb(255,0,0), hexadecimal de 6 cifras (#ff0000) y de 3 (#f00, abreviada). RGB: 256×256×256 = unos 16 millones de colores."],
["Unidades","Absoluta: px. Relativas: % (del contenedor), em (tamaño de fuente del elemento padre), rem (tamaño de fuente del html). calc() mezcla unidades.","width:calc(100% - 20px);"]]],
["CSS: texto","txt2",[
["Propiedades de texto","color, font-size, font-weight (negrita), text-align (left, center, right, justify), text-transform (uppercase, lowercase, capitalize), text-decoration (underline, none, line-through).","h1{text-transform:uppercase;text-align:center}"]]],
["CSS: posicionamiento","pos",[
["Tipos de position","relative: se desplaza desde su posición normal y sigue ocupando su hueco. absolute: sale del flujo y se coloca respecto al ancestro posicionado más cercano. fixed: se fija respecto a la ventana.","position:absolute; top:10px; left:20px;"],
["Contenedor de referencia y z-index","Para que un absolute se posicione respecto a su padre, este debe tener position: relative. z-index decide qué elemento queda por encima.","padre{position:relative}\nhijo{position:absolute;z-index:5}"]]],
["CSS: Flexbox","flx",[
["Contenedor","display:flex activa flexbox. flex-direction: row (defecto) o column. flex-wrap: wrap permite varias líneas. justify-content alinea en el eje principal; align-items en el cruzado. gap separa los hijos.","display:flex;\nflex-direction:row;\nflex-wrap:wrap;\njustify-content:space-between;\nalign-items:center;\ngap:16px;"],
["Propiedades de los hijos","flex-grow (cuánto crece), flex-shrink (cuánto se encoge), flex-basis (tamaño base). Abreviatura: flex: grow shrink basis.","flex:1 1 200px;"],
["Tarjetas en rejilla","Fichas con flex, wrap y calc() para repartir el ancho descontando los gap.","ul{display:flex;flex-wrap:wrap;gap:20px}\nli{width:calc(33.33% - 20px)}"]]],
["Diseño responsive","rsp",[
["Mobile first y media queries","Se diseña primero para móvil y se amplía con @media (min-width: …) en los puntos de ruptura (breakpoints).","@media (min-width:768px){\n  main{display:flex}\n}"],
["Imágenes fluidas","width:100% y height:auto para que se adapten al contenedor.","img{width:100%;height:auto}"],
["Menú de hamburguesa","En móvil el menú se oculta con display:none y se muestra con display (flex/block) al pulsar el botón. En pantallas grandes cambia de orientación con flex-direction (column → row).","nav ul{display:none;flex-direction:column}\n@media(min-width:768px){nav ul{display:flex;flex-direction:row}}"]]]
];

["¿Por qué es importante <title>?",["Se ve en el cuerpo de la página","Aparece en la pestaña, favoritos y buscadores","Cambia el color de fondo","Es opcional y no sirve para nada"],1,"Es clave para SEO, accesibilidad y la pestaña del navegador."],
